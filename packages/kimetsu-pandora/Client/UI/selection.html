<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pandora - Sélection de personnage</title>
<!-- Écran de sélection de personnage seul, à ouvrir dans un navigateur (planche Figma « Voix démon »). Le même écran est intégré au HUD (index.html, id="select").
     Réglages dans l'adresse : ?grade=Mizunoto&nom=Tanjiro&kanji=水&couleur=%232f8fd0 ; sans camp : ?camp=aucun -->
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050204; }
.hidden { display: none; }
/* Sélection de personnage (planche Figma « Voix démon ») : même échelle que l'écran de bienvenue (1em = 1/120 de la largeur) */
#select { position: fixed; inset: 0; z-index: 70; background: #050204 url("img/kukushibo-bg.png") center center / cover no-repeat; color: #f4eee6; font-family: "Montserrat", "Segoe UI", system-ui, sans-serif; font-size: calc(100vw / 120); overflow: hidden; }
#sl-glow { position: absolute; left: 6%; top: -6em; width: 60em; height: 24em; background: radial-gradient(ellipse, rgba(150, 10, 30, 0.45), rgba(0, 0, 0, 0) 68%); filter: blur(1.6em); }
#sl-box { position: absolute; inset: 2.4em 5em 3em; display: flex; flex-direction: column; gap: 1.4em; }
#sl-box header { display: flex; justify-content: space-between; align-items: center; gap: 2em; padding: 1.1em 1.6em; border-radius: 0.7em; border: 1px solid rgba(255, 255, 255, 0.08); background: radial-gradient(ellipse at 6% 0%, rgba(170, 12, 32, 0.4), rgba(0, 0, 0, 0) 55%), rgba(255, 255, 255, 0.025); }
#sl-box h2 { margin: 0; display: flex; align-items: center; gap: 0.6em; font-family: "Montserrat", "Segoe UI Black", "Arial Black", sans-serif; font-weight: 900; font-size: 1.35em; letter-spacing: 0.01em; }
#sl-box h2 svg { width: 1.1em; height: 1.1em; fill: #cf1f40; }
#sl-box header p { margin: 0.35em 0 0; font-size: 0.8em; color: rgba(244, 238, 230, 0.6); }
.sl-actions { display: flex; align-items: center; gap: 0.8em; }
#sl-discord { display: flex; align-items: center; gap: 0.6em; padding: 0.7em 1.1em; border-radius: 0.4em; background: #5865f2; color: #fff; font-size: 0.8em; font-weight: 700; }
#sl-discord.hidden { display: none; }
#sl-discord svg { width: 1.2em; height: 1.2em; fill: currentColor; }
#sl-back { cursor: pointer; padding: 0.7em 1.2em; border-radius: 0.4em; border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(255, 255, 255, 0.05); color: #f4eee6; font: inherit; font-size: 0.8em; font-weight: 600; }
#sl-back:hover { background: rgba(255, 255, 255, 0.12); }
#sl-slots { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2em; }
.sl-card { position: relative; display: flex; flex-direction: column; align-items: center; min-height: 0; padding: 1.2em 1.2em 1.6em; border-radius: 0.6em; border: 1px solid rgba(255, 255, 255, 0.07); background: radial-gradient(ellipse at 50% 38%, color-mix(in srgb, var(--sl-color, #7a1030) 22%, transparent), rgba(0, 0, 0, 0) 62%), #0a0608; }
.sl-card.on { border-color: color-mix(in srgb, var(--sl-color) 40%, transparent); }
.sl-art { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.sl-art span { font-size: 12em; line-height: 1; font-weight: 800; color: var(--sl-color); opacity: 0.9; text-shadow: 0 0 0.35em var(--sl-color); }
.sl-card.locked .sl-art svg { width: 8em; height: 8em; fill: #b8182f; color: #b8182f; filter: drop-shadow(0 0 1em rgba(207, 31, 64, 0.65)); }
.sl-card.locked { background: radial-gradient(ellipse at 50% 38%, rgba(150, 30, 190, 0.2), rgba(0, 0, 0, 0) 62%), #080506; }
.sl-name { font-family: "Montserrat", "Segoe UI Black", "Arial Black", sans-serif; font-weight: 900; font-size: 1.6em; letter-spacing: 0.01em; text-align: center; }
/* bouton « coup de pinceau » */
.sl-pick { margin-top: 0.8em; cursor: pointer; border: 0; padding: 0.55em 2.6em; font: inherit; font-size: 0.82em; font-weight: 800; letter-spacing: 0.02em; color: #fff; background: linear-gradient(#a3182c, #7e0f1f); clip-path: polygon(1% 14%, 5% 0, 18% 9%, 38% 0, 60% 8%, 82% 0, 99% 12%, 100% 52%, 97% 100%, 74% 91%, 48% 100%, 24% 92%, 4% 100%, 0 58%); }
.sl-pick:hover:not(:disabled) { background: linear-gradient(#c21d36, #94112a); }
.sl-pick:disabled { cursor: default; }

</style>
</head>
<body>
	<div id="select">
		<div id="sl-glow"></div>
		<div id="sl-box">
			<header>
				<div class="sl-head">
					<h2><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 9.500l2.500 1.500M16 9.500L13.500 11M8.500 16c2-2 5-2 7 0" fill="none" stroke="#12070B" stroke-width="2" stroke-linecap="round"/></svg>SELECTION DE PERSONNAGE</h2>
					<p>Voici tous les personnages que vous possédez, sélectionnez en un.</p>
				</div>
				<div class="sl-actions">
					<span id="sl-discord" class="hidden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5.400A17 17 0 0 0 15.800 4l-.5 1a15.600 15.600 0 0 0-4.600 0l-.5-1A17 17 0 0 0 6 5.400C3.400 9.300 2.700 13.100 3 16.800a17 17 0 0 0 5.200 2.600l1.100-1.800a11 11 0 0 1-1.700-.8l.4-.3a12 12 0 0 0 10 0l.4.300a11 11 0 0 1-1.700.8l1.100 1.800a17 17 0 0 0 5.200-2.600c.4-4.300-.7-8-3-11.400Z"/></svg>Rejoindre le serveur Discord</span>
					<button id="sl-back" type="button">&#8592; Retour</button>
				</div>
			</header>
			<div id="sl-slots"></div>
		</div>
	</div>


<script>
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const camp = q.get("camp") !== "aucun";
const rank = q.get("grade") || "Lune Inférieure Six";
const glyph = camp ? (q.get("kanji") || "鬼") : "?";
const color = camp ? (q.get("couleur") || "#c8323c") : "#8b8580";
const lock = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>';
const cards = [`<div class="sl-card on" style="--sl-color:${color}"><div class="sl-art"><span>${glyph}</span></div><div class="sl-name">${rank.toUpperCase()}</div><button type="button" class="sl-pick">${camp ? "SELECTIONNEZ" : "CRÉER"}</button></div>`];
for (let i = 2; i <= 3; i++) cards.push(`<div class="sl-card locked"><div class="sl-art">${lock}</div><div class="sl-name">EMPLACEMENT ${i}</div><button type="button" class="sl-pick" disabled>[Conditions]</button></div>`);
$("sl-slots").innerHTML = cards.join("");
// Page de démonstration : dans le jeu, « Retour » revient à l'écran de bienvenue et « Selectionnez » continue l'arrivée.
</script>
</body>
</html>
