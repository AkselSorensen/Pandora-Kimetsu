<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sélection re-roll — aperçu</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{min-height:100vh;background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.38)),url("img/reroll-background.png") center/100% 100% no-repeat;color:#fff;font:16px Inter,Segoe UI,Arial,sans-serif;display:grid;place-items:center;padding:3vh 3vw}.panel{width:min(96vw,1450px);display:flex;flex-direction:column;gap:1.25em}.head{position:relative;width:100%}.title-art{display:block;width:100%;height:auto}.head-actions{position:absolute;right:2.5%;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:.55em}.head-actions button{display:block;padding:0;border:0;background:transparent;cursor:pointer;transition:transform .16s ease,filter .16s ease}.head-actions button:hover{transform:translateY(-1px);filter:brightness(1.16)}.head-actions img{display:block;width:auto;height:clamp(2.35em,4vw,3.35em)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));justify-items:center;gap:clamp(.7em,2vw,2em)}.card{position:relative;display:block;width:min(100%,414px);aspect-ratio:414/546;padding:0;border:1px solid #ffffff24;border-radius:10px;overflow:hidden;background:#080608;cursor:pointer;text-align:left;transition:.18s}.card img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}.card:first-child img,.card:last-child img{inset:0 0 0 auto;width:auto;max-width:none;height:100%;object-fit:contain}.card:hover{transform:translateY(-5px);border-color:#fff9}.card.selected{border-color:#f4e8ea;box-shadow:0 0 0 2px #ffffffb3,0 0 28px #d2233a59}.picked{position:absolute;right:.8em;top:.8em;opacity:0;padding:.5em .8em;border-radius:999px;background:#190c10e0;font-size:.8em;font-weight:800}.card.selected .picked{opacity:1}.note{margin:0;text-align:center;color:#ffffff80;font-size:.8em}@media(max-width:760px){body{padding:2vh 3vw}.cards{gap:.55em}.card{border-radius:6px}}
</style></head><body><main class="panel"><header class="head"><img class="title-art" src="img/reroll-title.png" alt="Menu reroll"><div class="head-actions"><button aria-label="Retour"><img src="img/reroll-back.png" alt="Retour"></button><button aria-label="Fermer"><img src="img/reroll-close.png" alt="Fermer"></button></div></header><section class="cards"><button class="card"><img src="img/reroll-capacite.png" alt="Re-roll capacité"><span class="picked">Sélectionné</span></button><button class="card"><img src="img/reroll-armes.png" alt="Re-roll armes"><span class="picked">Sélectionné</span></button><button class="card"><img src="img/reroll-equipements.png" alt="Re-roll équipements"><span class="picked">Sélectionné</span></button></section><p class="note">La sélection est visuelle pour le moment.</p></main><script>document.querySelectorAll('.card').forEach(card=>card.addEventListener('click',()=>document.querySelectorAll('.card').forEach(item=>item.classList.toggle('selected',item===card)));document.querySelectorAll('.head-actions button').forEach(button=>button.addEventListener('click',()=>document.querySelectorAll('.card').forEach(card=>card.classList.remove('selected'))));</script></body></html>
