<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;color:#fff}body{display:grid;place-items:center;padding:2vh 2vw;background:linear-gradient(#0005,#0008),url("img/reroll-background.png") center/cover fixed}.panel{width:min(1500px,94vw);height:min(820px,92vh);margin:auto;padding:1.2em;border:1px solid #ffffff22;border-radius:14px;background:linear-gradient(#0008,#0008),url("img/reroll-background.png") center/cover;box-shadow:0 24px 90px #000}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1em}.head img{display:block;width:min(720px,75%)}.head button{width:2.6em;height:2.6em;border:1px solid #ffffff40;border-radius:50%;background:#ffffff0c;color:#fff;font-size:1.4em;cursor:pointer}.layout{display:grid;grid-template-columns:260px 300px minmax(420px,1fr);gap:1em;align-items:start}.box{min-width:0;border:1px solid #ffffff24;border-radius:10px;background:#030305c9;overflow:hidden}.profile img,.rarities img{display:block;width:100%;height:auto}.reel{display:flex;flex-direction:column;align-items:center;gap:.8em;padding:1em}.window{position:relative;width:100%;height:240px;overflow:hidden;border:1px solid #ffffff30;border-radius:10px;background:#000}.window:before,.window:after{content:"";position:absolute;z-index:3;top:0;width:70px;height:100%;pointer-events:none}.window:before{left:0;background:linear-gradient(90deg,#000,transparent)}.window:after{right:0;background:linear-gradient(90deg,transparent,#000)}.pointer{position:absolute;z-index:4;top:0;bottom:0;left:50%;width:3px;background:#f8e596;box-shadow:0 0 14px #f8e596;transform:translateX(-50%)}.track{display:flex;align-items:center;gap:10px;width:max-content;height:100%;padding:0 16px;transition:transform 3.2s cubic-bezier(.08,.82,.12,1)}.track.roll{transform:translateX(-1200px)}.slot{position:relative;display:block;flex:0 0 179px;width:179px;height:180px;min-height:180px;overflow:hidden;background:#171719;color:transparent}.slot img{display:block;width:100%;height:100%;object-fit:fill}.slot i{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#fff9,transparent 48%)}.slot[data-rarity="epic"] i{background:linear-gradient(0deg,#c000ffde,transparent 52%)}.slot[data-rarity="mythic"] i{background:linear-gradient(0deg,#f20b0bde,transparent 52%)}.slot[data-rarity="common"] i{background:linear-gradient(0deg,#eeeeeecc,transparent 52%)}.slot[data-rarity="pandorium"] i{background:linear-gradient(0deg,#28202f,transparent 52%)}.slot[data-rarity="rare"] i{background:linear-gradient(0deg,#075bffde,transparent 52%)}.result{min-height:1.2em;color:#ddd;text-align:center}.buttons{position:relative;width:min(360px,100%)}.buttons img{display:block;width:100%}.buttons button{position:absolute;left:0;width:100%;height:42%;border:0;background:transparent;cursor:pointer}.buttons #roll{top:24%}.buttons #supply{top:68%}@media(max-width:1050px){.panel{height:94vh;overflow:auto}.layout{grid-template-columns:220px 1fr}.reel{grid-column:1/-1}}@media(max-width:650px){body{padding:1vh 1vw}.panel{width:98vw;height:98vh}.layout{grid-template-columns:1fr}.rarities{order:3}.reel{grid-column:auto}}
 .track{transition:transform 18s cubic-bezier(.08,.82,.12,1)}.track.roll{transform:translateX(var(--roll-end,-2500px))}
 .rarities{position:relative}.rarity-pity{position:absolute;inset:0;pointer-events:none;font:900 clamp(9px,1vw,13px) Arial,sans-serif;color:#d0d0d3;text-shadow:0 1px 2px #000}.rarity-pity span{position:absolute;left:26%;white-space:nowrap}.rarity-pity span:nth-child(1){top:6.7%}.rarity-pity span:nth-child(2){top:15.3%}.rarity-pity span:nth-child(3){top:23.9%}.rarity-pity span:nth-child(4){top:32.5%}.rarity-pity span:nth-child(5){top:41.1%}.head{position:relative;padding-right:300px;min-height:0}.head>img{width:min(720px,75%);height:auto;object-fit:contain}.head button{position:static;width:auto;height:auto;border:0;border-radius:0;background:transparent;font-size:0}.preview-actions{position:absolute;right:0;top:0;z-index:5;display:flex;gap:10px}.preview-actions img{display:block;width:140px!important;height:auto}.track{transition:transform 18s cubic-bezier(.08,.82,.12,1)}.track.roll{transform:translateX(var(--roll-end,-2500px))}
body{background:transparent}.panel{background:linear-gradient(#0005,#0007),url("img/reroll-background.png") center/cover}
body.hidden{display:none}.preview-actions{display:flex;gap:10px}.preview-actions img{width:140px!important}.rarities img{font-weight:900}.rarities:after{line-height:4.8}.preview-actions button{cursor:pointer}</style>

<body><main class="panel"><header class="head"><img src="img/reroll-title.png" alt="Menu reroll"><div class="preview-actions"><button id="ar-back" aria-label="Retour"><img src="img/reroll-back.png" alt="Retour"></button><button id="ar-close" aria-label="Fermer"><img src="img/reroll-close.png" alt="Fermer"></button></div></header><section class="layout"><aside class="box profile"><img src="img/reroll-slot-profile.png" alt="Profil du personnage"></aside><section class="box rarities"><img src="img/reroll-rarity-title.png" alt="Raretés et probabilités"><div class="rarity-pity"><span>0/2000</span><span>0/1250</span><span>0/1000</span><span>0/250</span><span>0/150</span></div></section><section class="box reel"><div class="window"><div class="pointer"></div><div class="track" id="track"><div class="slot" aria-hidden="true"><img src="img/reroll-item-slot.png" alt=""><i></i></div><div class="slot" aria-hidden="true"><img src="img/reroll-item-slot.png" alt=""><i></i></div><div class="slot" aria-hidden="true"><img src="img/reroll-item-slot.png" alt=""><i></i></div><div class="slot" aria-hidden="true"><img src="img/reroll-item-slot.png" alt=""><i></i></div><div class="slot" aria-hidden="true"><img src="img/reroll-item-slot.png" alt=""><i></i></div><div class="slot" aria-hidden="true"><img src="img/reroll-item-slot.png" alt=""><i></i></div><div class="slot" aria-hidden="true"><img src="img/reroll-item-slot.png" alt=""><i></i></div><div class="slot" aria-hidden="true"><img src="img/reroll-item-slot.png" alt=""><i></i></div><div class="slot" aria-hidden="true"><img src="img/reroll-item-slot.png" alt=""><i></i></div><div class="slot" aria-hidden="true"><img src="img/reroll-item-slot.png" alt=""><i></i></div><div class="slot" aria-hidden="true"><img src="img/reroll-item-slot.png" alt=""><i></i></div><div class="slot" aria-hidden="true"><img src="img/reroll-item-slot.png" alt=""><i></i></div><div class="slot" aria-hidden="true"><img src="img/reroll-item-slot.png" alt=""><i></i></div <script>
const track=document.getElementById('track'),result=document.getElementById('result'),roll=document.getElementById('roll');
const rarityOrder=['common','rare','epic','mythic','common','pandorium','rare','common','epic','common'];
let finalPayload=null,fastFrame=0,fastX=0,fastActive=false,spinToken=0;
function rarityKey(value){const r=String(value||'common').toLowerCase();if(r.includes('pand'))return 'pandorium';if(r.includes('myth')||r.includes('legend'))return 'mythic';if(r.includes('epic')||r.includes('violet'))return 'epic';if(r.includes('rare')||r.includes('blue'))return 'rare';return 'common'}
function setSlots(winningRarity){const stopIndex=48,count=60;track.innerHTML=Array.from({length:count},(_,i)=>{const rarity=i===stopIndex?winningRarity:rarityOrder[i%rarityOrder.length];return '<div class="slot" data-rarity="'+rarity+'" aria-hidden="true"><img src="img/reroll-item-slot.png" alt=""><i></i></div>'}).join('');return stopIndex}
function beginFastSpin(token){fastActive=true;const started=performance.now(),lap=10*189;function frame(now){if(!fastActive||token!==spinToken)return;fastX=-(((now-started)*1.15)%lap);track.style.transform='translateX('+fastX+'px)';fastFrame=requestAnimationFrame(frame)}fastFrame=requestAnimationFrame(frame)}
function finishOnResult(payload,token){if(token!==spinToken||!payload)return;finalPayload=payload;fastActive=false;cancelAnimationFrame(fastFrame);const rarity=rarityKey(payload.rarity);const winnerIndex=setSlots(rarity);track.style.transition='none';track.style.transform='translateX('+fastX+'px)';void track.offsetWidth;const viewport=track.parentElement;const tile=track.children[winnerIndex];const tileCenter=tile.getBoundingClientRect().left-track.getBoundingClientRect().left+tile.offsetWidth/2;const targetX=viewport.clientWidth/2-tileCenter;const duration=20000;result.textContent='Le résultat est prêt…';requestAnimationFrame(()=>{if(token!==spinToken)return;track.style.transition='transform '+duration+'ms cubic-bezier(.08,.82,.12,1)';track.style.transform='translateX('+targetX+'px)'});let completed=false;const done=()=>{if(completed||token!==spinToken)return;completed=true;track.removeEventListener('transitionend',done);showResult(payload);roll.disabled=false};track.addEventListener('transitionend',event=>{if(event.propertyName==='transform')done()});setTimeout(done,duration+500)}
function showResult(payload){const name=payload.name||payload.className||payload.class||'Capacité';const demon=Boolean(payload.demon);const verb=demon?'Nouveau pouvoir sanguinaire : ':'Nouveau souffle : ';result.textContent=verb+name+' ('+String(payload.rarity||'common').toUpperCase()+')'}
function openSelector(open){document.body.classList.toggle('hidden',!open)}
if(window.Events){Events.Subscribe('wakfu:rerollSelectorOpen',openSelector);Events.Subscribe('wakfu:abilityRerolled',payload=>{try{finishOnResult(typeof payload==='string'?JSON.parse(payload):payload,spinToken)}catch(_){}});Events.Subscribe('wakfu:abilityRerollFailed',reason=>{fastActive=false;cancelAnimationFrame(fastFrame);result.textContent=reason==='not_enough_kamas'?'Yens insuffisants':reason==='no_reroll'?"Vous n'avez aucun reroll":'Reroll impossible';roll.disabled=false});document.getElementById('ar-close').onclick=()=>Events.Call('wakfu:abilityPreviewClose');document.getElementById('ar-back').onclick=()=>Events.Call('wakfu:abilityPreviewBack')}
roll.onclick=()=>{if(roll.disabled)return;roll.disabled=true;finalPayload=null;spinToken++;const token=spinToken;setSlots('common');track.style.transition='none';track.style.transform='translateX(0px)';fastX=0;result.textContent='La roulette tourne…';beginFastSpin(token);setTimeout(()=>{if(token!==spinToken||finalPayload)return;fastActive=false;cancelAnimationFrame(fastFrame);result.textContent='Reroll impossible';roll.disabled=false},8000);if(window.Events)Events.Call('wakfu:abilityReroll');else{const demo={class:'Souffle de la Foudre',rarity:'rare',demon:false};setTimeout(()=>finishOnResult(demo,token),150)}};
</script></body></html>
