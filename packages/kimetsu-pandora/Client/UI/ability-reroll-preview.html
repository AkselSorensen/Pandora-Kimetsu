<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu reroll — aperçu</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;color:#fff}body{padding:3vh 3vw;background:linear-gradient(#0005,#0008),url("img/reroll-background.png") center/cover fixed}.panel{width:min(1500px,94vw);margin:auto;padding:1.2em;border:1px solid #ffffff22;border-radius:14px;background:#030306cf;box-shadow:0 24px 90px #000}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1em}.head img{display:block;width:min(720px,75%)}.head button{width:2.6em;height:2.6em;border:1px solid #ffffff40;border-radius:50%;background:#ffffff0c;color:#fff;font-size:1.4em;cursor:pointer}.layout{display:grid;grid-template-columns:260px 300px minmax(420px,1fr);gap:1em;align-items:start}.box{min-width:0;border:1px solid #ffffff24;border-radius:10px;background:#030305c9;overflow:hidden}.profile img,.rarities img{display:block;width:100%;height:auto}.reel{display:flex;flex-direction:column;align-items:center;gap:.8em;padding:1em}.window{position:relative;width:100%;height:240px;overflow:hidden;border:1px solid #ffffff30;border-radius:10px;background:#000}.window:before,.window:after{content:"";position:absolute;z-index:3;top:0;width:70px;height:100%;pointer-events:none}.window:before{left:0;background:linear-gradient(90deg,#000,transparent)}.window:after{right:0;background:linear-gradient(90deg,transparent,#000)}.pointer{position:absolute;z-index:4;top:0;bottom:0;left:50%;width:3px;background:#f8e596;box-shadow:0 0 14px #f8e596;transform:translateX(-50%)}.track{display:flex;align-items:center;gap:10px;width:max-content;height:100%;padding:0 16px;transition:transform 3.2s cubic-bezier(.08,.82,.12,1)}.track.roll{transform:translateX(-1200px)}.slot{flex:0 0 179px;width:179px;height:180px;background:url("img/reroll-slots.png") no-repeat;color:transparent}.slot:nth-child(5n+1){background-position:0 0}.slot:nth-child(5n+2){background-position:-198px 0}.slot:nth-child(5n+3){background-position:-397px 0}.slot:nth-child(5n+4){background-position:-596px 0}.slot:nth-child(5n){background-position:-794px 0}.result{min-height:1.2em;color:#ddd;text-align:center}.buttons{position:relative;width:min(360px,100%)}.buttons img{display:block;width:100%}.buttons button{position:absolute;left:0;width:100%;height:42%;border:0;background:transparent;cursor:pointer}.buttons #roll{top:24%}.buttons #supply{top:68%}@media(max-width:1050px){.layout{grid-template-columns:220px 1fr}.reel{grid-column:1/-1}}@media(max-width:650px){body{padding:1vh 1vw}.layout{grid-template-columns:1fr}.rarities{order:3}.reel{grid-column:auto}}
 .track{transition:transform 18s cubic-bezier(.08,.82,.12,1)}.track.roll{transform:translateX(var(--roll-end,-2500px))}
</style>
</head>
<body><main class="panel"><header class="head"><img src="img/reroll-title.png" alt="Menu reroll"><button onclick="location.reload()">×</button></header><section class="layout"><aside class="box profile"><img src="img/reroll-slot-profile.png" alt="Profil du personnage"></aside><section class="box rarities"><img src="img/reroll-rarity-title.png" alt="Raretés et probabilités"></section><section class="box reel"><div class="window"><div class="pointer"></div><div class="track" id="track"></div></div><div class="result" id="result">Prêt à tenter votre chance</div><div class="buttons"><img src="img/reroll-buttons.png" alt="Actions"><button id="roll" aria-label="Reroll"></button><button id="supply" aria-label="Approvisionner"></button></div></section></section></main>
<script>const names=['Souffle de l’Eau','Souffle de la Foudre','Souffle des Flammes','Souffle du Vent','Souffle de la Brume','Souffle de l’Insecte'];const track=document.getElementById('track'),result=document.getElementById('result'),roll=document.getElementById('roll');function fill(){track.innerHTML=Array.from({length:38},()=>'<div class="slot" aria-hidden="true"></div>').join('')}fill();roll.onclick=()=>{roll.disabled=true;result.textContent='La roulette tourne…';const winner=34;const finalX=Math.round(track.parentElement.clientWidth/2-(winner*189+89.5));track.style.setProperty('--roll-end',finalX+'px');void track.offsetWidth;track.classList.add('roll');setTimeout(()=>{track.classList.remove('roll');track.style.transform='translateX('+finalX+'px)';result.textContent='Nouvelle classe : '+names[Math.floor(Math.random()*names.length)];roll.disabled=false},18000)};</script></body></html>
