<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:Georgia,serif}
#b{position:fixed;top:9%;left:50%;transform:translate(-50%,-20px);max-width:60vw;padding:14px 34px;text-align:center;
 background:linear-gradient(#f3e6c4,#e2cc98);border:2px solid #7a5b2a;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.5);
 color:#3b2a10;opacity:0;transition:opacity .4s,transform .4s;pointer-events:auto}
#b.on{opacity:1;transform:translate(-50%,0)}
#x{position:absolute;top:6px;right:12px;cursor:pointer;font:700 16px sans-serif;color:#7a5b2a}#x:hover{color:#a2441a}
#hint{font:11px sans-serif;color:#7a5b2a;margin-top:6px;opacity:.7}
#t{font:700 13px Georgia,serif;letter-spacing:.2em;color:#a2441a;margin-bottom:4px}
#m{font-size:24px;font-weight:700;line-height:1.25}
</style></head><body><div id="b"><div id="x" title="Fermer">✕</div><div id="t">ANNONCE</div><div id="m"></div><div id="hint">Maintiens Alt pour la souris</div></div>
<script>
let timer;
document.getElementById("x").onclick=()=>{document.getElementById("b").classList.remove("on");Events.Call("Close");};
Events.Subscribe("Announce",(text,author,seconds)=>{
  document.getElementById("m").textContent=text;
  document.getElementById("t").textContent=("ANNONCE"+(author?" · "+author:"")).toUpperCase();
  const b=document.getElementById("b");b.classList.add("on");
  clearTimeout(timer);timer=setTimeout(()=>b.classList.remove("on"),(seconds||8)*1000);
});
</script></body></html>
