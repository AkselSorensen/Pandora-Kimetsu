<!doctype html>
<html><head><meta charset="utf-8"><title>Pandora Cases</title>
<style>
  :root { --win: #1b1b1b; --top: #161616; --side: #141414; --panel: #222; --field: #2f2f2f; --text: #ececec; --muted: #9a9a9a; --gold: #c9912f; --green: #39d353; --red: #e0453c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: var(--text); overflow: hidden; user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
  input, select { font: inherit; color: var(--text); background: var(--field); border: 1px solid transparent; border-radius: 5px; padding: 8px 10px; outline: none; }
  input:focus, select:focus { border-color: rgba(255,255,255,.25); }
  select option { background: #222; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

  .window { position: absolute; left: 50%; top: 50%; width: min(1400px, 76vw); height: min(800px, 76vh); transform: translate(-50%, -50%); background: var(--win); display: grid; grid-template-columns: 100px 1fr; grid-template-rows: 50px 1fr; box-shadow: 0 20px 70px rgba(0,0,0,.7); }
  .titlebar { grid-column: 1 / 3; background: var(--top); display: flex; align-items: center; justify-content: center; position: relative; }
  .titlebar h1 { margin: 0; font-size: 28px; font-weight: 400; letter-spacing: .02em; }
  .wallet { position: absolute; left: 16px; font-weight: 700; color: #7ee787; background: rgba(57,211,83,.1); padding: 6px 12px; border-radius: 6px; font-size: 16px; }
  .tools { position: absolute; right: 12px; display: flex; gap: 8px; align-items: center; }
  .tools select { padding: 4px 6px; background: #222; font-size: 12px; }
  .x { width: 34px; height: 34px; font-size: 20px; color: #ddd; border-radius: 5px; }
  .x:hover { background: rgba(255,255,255,.08); }
  nav { background: var(--side); display: flex; flex-direction: column; }
  nav button { height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #cfcfcf; font-size: 15px; letter-spacing: .02em; }
  nav button svg { width: 38px; height: 38px; fill: #d9d9d9; }
  nav button:hover { background: rgba(255,255,255,.04); }
  nav button.active { background: var(--gold); color: #fff; } nav button.active svg { fill: #fff; }
  nav .spacer { flex: 1; }
  main { overflow: auto; padding: 22px 26px; position: relative; }
  .head { background: var(--panel); border-radius: 6px; text-align: center; padding: 9px; font-weight: 800; font-size: 22px; letter-spacing: .02em; margin-bottom: 18px; }
  .panel { background: var(--panel); border-radius: 6px; padding: 14px; }
  .panel > h3 { margin: 0 0 12px; font-size: 18px; font-weight: 600; letter-spacing: .02em; display: flex; gap: 10px; align-items: center; }
  .section-title { margin: 18px 0 10px; font-size: 18px; font-weight: 600; letter-spacing: .03em; }
  .filters { background: var(--panel); border-radius: 6px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .search { position: relative; } .search input { padding-left: 32px; width: 260px; } .search svg { position: absolute; left: 9px; top: 10px; width: 17px; fill: #bbb; }
  .filters select { background: transparent; font-size: 17px; min-width: 150px; }
  .grow { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 14px; }
  .empty { color: var(--muted); padding: 50px; text-align: center; font-size: 16px; grid-column: 1 / -1; }
  .muted { color: var(--muted); }

  /* cards */
  .card { position: relative; background: #2b2b2b; border-radius: 4px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: transform .12s, box-shadow .12s; min-height: 230px; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.45); }
  .card.sel { outline: 3px solid var(--gold); outline-offset: -3px; }
  .card .ch { text-align: center; color: #fff; font-size: 18px; padding: 5px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .card .art { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 140px; overflow: hidden; }
  .card .art .bg { position: absolute; inset: 0; opacity: .85; }
  .card .art .bg:after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.06) 0 40px, rgba(0,0,0,.04) 40px 90px); }
  .card .art svg.pic, .card .art img { position: relative; z-index: 1; width: 62%; max-height: 80%; filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)); }
  .card .tl { position: absolute; left: 10px; top: 10px; z-index: 2; display: flex; gap: 5px; flex-direction: column; align-items: flex-start; }
  .tag { font-size: 12px; padding: 3px 8px; border-radius: 5px; background: rgba(25,25,40,.65); color: #8fb4ff; }
  .tag.seller { color: #7ee787; } .tag.eq { color: #ffd27a; } .tag.q { width: 20px; height: 20px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(0,0,0,.6); font-weight: 800; }
  .keyb { position: absolute; right: 10px; top: 10px; z-index: 2; background: rgba(0,0,0,.55); border-radius: 5px; padding: 4px 7px; display: flex; } .keyb svg { width: 26px; height: 14px; fill: #fff; }
  .count { position: absolute; right: 10px; top: 10px; z-index: 2; background: rgba(0,0,0,.6); border-radius: 5px; padding: 2px 8px; font-weight: 700; font-size: 14px; }
  .pricep { position: absolute; right: 10px; bottom: 8px; z-index: 2; background: rgba(40,140,60,.4); color: #fff; font-size: 18px; padding: 2px 6px; border-radius: 5px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .lockp { position: absolute; inset: 0; z-index: 3; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-align: center; padding: 10px; }
  .card .rr { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,.28); padding: 7px 18px; font-size: 13px; letter-spacing: .03em; }
  .pill { background: #1d1d1d; padding: 3px 14px; border-radius: 7px; font-size: 16px; }
  .card .cb { height: 8px; }
  .card.small { min-height: 0; } .card.small .ch { font-size: 13px; padding: 3px 6px; } .card.small .art { min-height: 90px; } .card.small .rr { padding: 4px 8px; justify-content: center; } .card.small .pill { font-size: 13px; } .card.small .rr span:first-child { display: none; } .card.small .cb { height: 5px; } .card.small .pricep { font-size: 13px; } .card.small .tl { left: 6px; top: 6px; }
  .chance { position: absolute; left: 6px; bottom: 6px; z-index: 2; background: rgba(0,0,0,.55); color: #7ee787; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
  .newcard { border: 2px dashed #444; border-radius: 4px; min-height: 230px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 18px; cursor: pointer; }
  .newcard:hover { border-color: var(--gold); color: #fff; }

  /* home */
  .home { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 16px; min-height: calc(100% - 64px); }
  .home .panel { display: flex; flex-direction: column; }
  .home .col { display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .home .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 1; }
  .home .col .card { flex: 1; }

  /* buttons */
  .ob { border: 2px solid var(--green); border-radius: 18px; padding: 6px 22px; font-size: 18px; letter-spacing: .03em; background: #121212; white-space: nowrap; }
  .ob:hover { background: rgba(57,211,83,.12); }
  .ob.red { border-color: var(--red); } .ob.red:hover { background: rgba(224,69,60,.12); }
  .ob.gold { border-color: var(--gold); } .ob.gold:hover { background: rgba(201,145,47,.15); }
  .ob.grey { border-color: #555; color: #888; }
  .ob.small { font-size: 14px; padding: 4px 14px; }
  .ob.on { background: var(--green); color: #0b1a0e; }
  .sw { width: 108px; height: 36px; border-radius: 18px; background: var(--red); position: relative; transition: background .15s; flex: none; }
  .sw:after { content: ""; position: absolute; top: 4px; left: 6px; width: 28px; height: 28px; border-radius: 50%; background: #fff; transition: left .15s; }
  .sw.on { background: var(--green); } .sw.on:after { left: 74px; }

  /* settings */
  .tabs { display: flex; background: var(--top); margin: -22px -26px 22px; position: sticky; top: -22px; z-index: 5; }
  .tabs button { padding: 9px 20px; font-size: 22px; color: #cfcfcf; letter-spacing: .02em; }
  .tabs button.active { background: var(--gold); color: #fff; }
  .opts { display: grid; grid-template-columns: 250px 1fr; gap: 18px; min-height: calc(100% - 70px); }
  .opts .list { background: var(--panel); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 4px; align-self: start; min-height: 100%; }
  .opts .list button { text-align: left; padding: 6px 10px; font-size: 20px; border-radius: 6px; }
  .opts .list button.active { background: var(--gold); }
  .opt { display: flex; align-items: center; gap: 20px; padding: 10px 6px; }
  .opt .txt { flex: 1; } .opt b { font-size: 19px; display: block; } .opt span { color: #cfcfcf; font-size: 15px; }
  .opt input, .opt select { width: 230px; }
  .chips { display: flex; flex-wrap: wrap; gap: 14px; }
  .chip { min-width: 270px; display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-radius: 4px; font-size: 17px; color: #fff; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,.4); }

  /* modal */
  .modal { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 20; }
  .modal.open { display: flex; }
  .dlg { background: #141414; min-width: 420px; max-width: 94%; max-height: 94%; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .dlg .dh { display: flex; align-items: center; justify-content: center; position: relative; padding: 8px 50px; font-size: 26px; background: #181818; }
  .dlg .dh .x { position: absolute; right: 8px; }
  .dlg .db { padding: 18px 22px; overflow: auto; }
  .dlg .df { display: flex; justify-content: center; gap: 30px; padding: 4px 22px 20px; } .dlg .df:empty { display: none; }
  .subtabs { display: flex; background: #181818; } .subtabs button { padding: 7px 14px; font-size: 20px; color: #cfcfcf; } .subtabs button.active { background: var(--gold); color: #fff; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 30px; align-content: start; }
  .form label { display: flex; flex-direction: column; gap: 7px; font-size: 16px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
  .form label.wide { grid-column: 1 / 3; }
  .split { display: flex; gap: 22px; align-items: flex-start; }
  .preview { background: var(--panel); padding: 14px 18px; width: 290px; flex: none; } .preview h4 { text-align: center; margin: 0 0 10px; font-size: 20px; color: #ddd; letter-spacing: .03em; }
  .colorpick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .swatch { width: 26px; height: 26px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; } .swatch.on { border-color: #fff; }
  .contents { display: grid; grid-auto-rows: max-content; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; width: 640px; max-height: 420px; overflow: auto; padding: 3px; align-content: start; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 16px; }
  .qty { display: flex; align-items: center; gap: 12px; justify-content: center; margin-top: 16px; font-size: 18px; } .qty button { width: 32px; height: 32px; background: var(--field); border-radius: 5px; font-size: 18px; }

  /* trading */
  .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .prow { background: var(--panel); border-radius: 6px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; font-size: 18px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #c9912f, #6b3f9a); display: flex; align-items: center; justify-content: center; font-weight: 800; flex: none; }
  .trade { display: grid; grid-template-columns: 1.2fr 1fr 300px; gap: 16px; height: calc(100% - 64px); }
  .trade .panel { display: flex; flex-direction: column; min-height: 0; }
  .offer { overflow: auto; display: grid; grid-auto-rows: max-content; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 8px; align-content: start; margin: 8px 0; min-height: 60px; flex: 1; }
  .offer.mine { flex: none; max-height: 40%; background: rgba(201,145,47,.08); border-radius: 5px; padding: 6px; }
  .tstate { padding: 3px 10px; border-radius: 5px; font-size: 13px; background: #333; font-weight: 600; } .tstate.ok { background: var(--green); color: #08200d; }
  .tcred { display: flex; gap: 10px; align-items: center; } .tcred input { width: 140px; }
  .bigprice { font-size: 20px; color: #7ee787; }
  .chat { flex: 1; overflow: auto; background: #1a1a1a; border-radius: 5px; padding: 8px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
  .chat b { color: var(--gold); }
  .request { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); z-index: 15; background: #101010; border: 2px solid var(--gold); padding: 12px 18px; border-radius: 8px; display: none; gap: 14px; align-items: center; font-size: 17px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .request.show { display: flex; }

  .toast { position: absolute; right: 20px; top: 62px; z-index: 40; background: #101010; border-left: 4px solid var(--gold); padding: 10px 16px; font-size: 15px; opacity: 0; transform: translateY(-6px); transition: .2s; pointer-events: none; max-width: 380px; }
  .toast.show { opacity: 1; transform: none; } .toast.ok { border-color: var(--green); } .toast.error { border-color: var(--red); }

  /* unboxing */
  #unbox { position: absolute; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; background: #121212; }
  #unbox.open { display: flex; }
  #unbox .title { font-size: 26px; margin-bottom: 26px; letter-spacing: .04em; }
  #reels { width: 88%; display: flex; flex-direction: column; gap: 8px; }
  .reel { position: relative; width: 100%; height: 230px; overflow: hidden; background: #0d0d0d; }
  .reels-many .reel { height: 112px; } .reels-many .strip { top: 7px; } .reels-many .strip .card { height: 98px; } .reels-many .strip .card .art { min-height: 0; } .reels-many .strip .card svg.pic { max-height: 70%; }
  #rlist { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; } #rlist .card { width: 180px; } #rlist .card .art { min-height: 130px; } #rlist .card.best { outline: 3px solid var(--gold); outline-offset: -3px; }
  .strip { position: absolute; top: 14px; left: 0; display: flex; gap: 10px; will-change: transform; }
  .strip .card { width: 170px; height: 200px; flex: none; cursor: default; } .strip .card:hover { transform: none; box-shadow: none; }
  .marker { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--gold); z-index: 3; box-shadow: 0 0 12px var(--gold); }
  .reel:before, .reel:after { content: ""; position: absolute; top: 0; bottom: 0; width: 14%; z-index: 2; pointer-events: none; }
  .reel:before { left: 0; background: linear-gradient(90deg, #0d0d0d, transparent); } .reel:after { right: 0; background: linear-gradient(-90deg, #0d0d0d, transparent); }
  #reveal { margin-top: 26px; text-align: center; display: none; } #reveal.show { display: block; animation: pop .35s; } @keyframes pop { from { opacity: 0; transform: scale(.9); } }
  #rname { font-size: 34px; font-weight: 700; } #rrar { font-size: 16px; letter-spacing: .25em; margin: 6px 0 18px; }
</style></head>

  const draw = () => box.querySelectorAll(".swatch").forEach(s => s.classList.toggle("on", s.dataset.c === value));
  SWATCHES.forEach(c => { const s = el("div", "swatch"); s.style.background = c; s.dataset.c = c; s.onclick = () => { value = c; hex.value = c; draw(); change(c); }; box.appendChild(s); });
  hex.oninput = () => { if (/^#[0-9a-fA-F]{6}$/.test(hex.value)) { value = hex.value.toLowerCase(); draw(); change(value); } };
  box.appendChild(hex); draw(); return box;
}

  else if (sub.opt === "announcing") { const s = sel([["", t("none")]].concat(rarityOptions()), S.AnnounceFrom || ""); s.onchange = () => { S.AnnounceFrom = s.value; save(); }; row(t("annf"), t("annfd"), s); }
  else if (sub.opt === "trading") row(t("tren"), t("trend"), tog("TradeEnabled"));

  else renderRarities(p);

function renderRarities(p) {

  p.appendChild(el("div", "muted", list.length + " " + t("rarities").toLowerCase()));

  p.appendChild(chips);

function rarityEditor(list, i) {

    const n = field(f, t("name"), inp(r.name), true); field(f, t("color"), colorPicker(r.color, c => r.color = c), true); const w = field(f, t("weight"), inp(r.weight, "number"), true);
    body.appendChild(f);
    foot.appendChild(btn(t("save"), "", () => { r.name = n.value.trim() || r.name; r.weight = Number(w.value) || 0; send("rarities", { list }); closeModal(); }));
    if (list.length > 1) foot.appendChild(btn(t("del"), "red", () => { list.splice(i, 1); send("rarities", { list }); closeModal(); }));

}

function renderFeatured(root) {

// ── unboxing animation ──────────────────────────────────────────────────────────────────────────
let audio;
function beep(freq, len, vol, type) {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || "square"; o.frequency.value = freq; g.gain.setValueAtTime(vol || .04, audio.currentTime); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + len);
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + len); } catch (e) {}
}
function fanfare(level) { [523, 659, 784, 1046, 1318].slice(0, 2 + level).forEach((f, i) => setTimeout(() => beep(f, .35, .06, "triangle"), i * 110)); }
const DROPS = ["item_drop1_common.ogg", "item_drop2_uncommon.ogg", "item_drop3_rare.ogg", "item_drop4_mythical.ogg", "item_drop5_legendary.ogg"];
function unbox(res) {
  spinning = true; closeModal();
  const rolls = res.rolls || [{ strip: res.strip, win: res.win, uid: res.uid }];
  const many = rolls.length > 1, W = many ? 108 : 180, half = many ? 49 : 85;
  const c = D.cases[res.case] || { name: "", items: [] };
  $("reveal").classList.remove("show"); $("rlist").innerHTML = ""; $("rname").textContent = ""; $("rrar").textContent = "";
  $("utitle").textContent = t("opening") + " · " + c.name + (many ? " ×" + rolls.length : "");
  const mysteries = new Set((c.items || []).filter(e => e.mystery).map(e => e.item));
  const box = $("reels"); box.innerHTML = ""; box.className = many ? "reels-many" : ""; box.style.display = "";
  const strips = rolls.map(r => {
    const reel = el("div", "reel"), strip = el("div", "strip"); reel.appendChild(strip); reel.appendChild(el("div", "marker")); box.appendChild(reel);
    r.strip.forEach((id, i) => { const cd = card("item", D.items[id] || { name: "?", rarity: "" }, { small: true, mystery: mysteries.has(id) && i !== 44 }); if (many) cd.style.width = "98px"; strip.appendChild(cd); });
    return [reel, strip];
  });
  $("unbox").classList.add("open");
  sound("case_drop.ogg");
  const duration = 6500, start = performance.now(); let lastTile = -1;
  requestAnimationFrame(() => {
    strips.forEach(([reel, strip], i) => {
      const target = 44 * W + half - reel.clientWidth / 2 + (Math.random() * W * .7 - W * .35);
      const d = duration - (strips.length - 1 - i) * 250;   // the reels stop one after the other
      strip.style.transition = "transform " + d + "ms cubic-bezier(.08,.6,.12,1)"; strip.style.transform = "translateX(" + (-target) + "px)";
    });
    const [reel0, strip0] = strips[strips.length - 1];
    (function tick() {
      const m = new DOMMatrix(getComputedStyle(strip0).transform); const tile = Math.floor((-m.m41 + reel0.clientWidth / 2) / W);
      if (tile !== lastTile) { lastTile = tile; beep(900 + Math.random() * 120, .03, .03); }
      if (performance.now() - start < duration + 50) requestAnimationFrame(tick);
    })();
  });
  setTimeout(() => {
    const won = rolls.map(r => D.items[r.win] || { name: "?", rarity: "" });
    let best = 0; won.forEach((it, i) => { if (rarIndex(it.rarity) > rarIndex(won[best].rarity)) best = i; });
    const top = won[best], r = rar(top.rarity);
    const level = Math.min(4, Math.round(rarIndex(top.rarity) * 4 / Math.max(1, D.rarities.length - 1)));
    if (many) box.style.display = "none";
    if (many) won.forEach((it, i) => { const cd = card("item", it); if (i === best) cd.classList.add("best"); $("rlist").appendChild(cd); });
    else { $("rname").textContent = top.name; $("rname").style.color = r.color; $("rname").style.textShadow = "0 0 30px " + r.color;
      $("rrar").textContent = (top.rarity || "").toUpperCase(); $("rrar").style.color = r.color; }
    $("reveal").classList.add("show");
    sound(DROPS[level], () => fanfare(level));
  }, duration + 150);
}
$("rok").onclick = () => { $("unbox").classList.remove("open"); spinning = false; Events.Call("Request"); };

  const main = $("main"); const scroll = main.scrollTop; main.innerHTML = ""; redrawList = () => {};
  ({ home: renderHome, shop: renderShop, market: renderMarket, inventory: renderInventory, trading: renderTrading, settings: renderSettings })[page](main);
  main.scrollTop = scroll;
}
