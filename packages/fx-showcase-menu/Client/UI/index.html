<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX Showcase</title>
<style>
  :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; color: #eef2f8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { display: grid; place-items: center; }
  .panel { width: min(1050px, 92vw); height: min(760px, 88vh); display: grid; grid-template-rows: auto auto 1fr auto; background: rgba(5,14,27,.96); border: 1px solid rgba(180,205,230,.25); border-radius: 14px; box-shadow: 0 28px 90px #000b; overflow: hidden; }
  header { display:flex; align-items:center; gap:16px; padding:18px 22px; border-bottom:1px solid #ffffff20; }
  h1 { margin:0; font-size:25px; letter-spacing:.02em; }
  .hint { color:#9aa9bd; font-size:13px; margin-top:4px; }
  .push { flex:1; }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; border:1px solid #ffffff24; border-radius:8px; background:#ffffff0c; padding:9px 13px; }
  button:hover { background:#ffffff19; border-color:#69b8ff88; }
  .close { font-size:19px; width:40px; height:40px; padding:0; }
  .toolbar { display:flex; align-items:center; gap:9px; padding:13px 18px; border-bottom:1px solid #ffffff18; }
  .tab.active { color:#9bd0ff; background:#177bd533; border-color:#55aaff88; }
  #search { margin-left:auto; width:min(340px, 34vw); padding:10px 12px; border-radius:8px; border:1px solid #ffffff24; background:#ffffff0b; outline:none; }
  #search:focus { border-color:#57a9ff; }
  main { padding:15px 18px; overflow:auto; }
  .summary { color:#8f9db0; font-size:12px; padding:0 2px 11px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(225px,1fr)); gap:9px; }
  .item { min-height:72px; padding:12px; text-align:left; background:linear-gradient(135deg,#ffffff0d,#ffffff05); }
  .name { display:block; font-size:13px; font-weight:650; overflow-wrap:anywhere; }
  .meta { display:flex; justify-content:space-between; gap:8px; color:#92a0b2; font-size:11px; margin-top:8px; }
  .badge { color:#9bd0ff; }
  .empty { padding:34px; text-align:center; color:#9aa9bd; }
  footer { display:flex; align-items:center; gap:10px; padding:13px 18px; border-top:1px solid #ffffff20; }
  #notice { margin-left:auto; color:#94a6ba; font-size:12px; }
  @media(max-width:680px) { .panel { width:96vw; height:94vh; } header { padding:13px; } h1 { font-size:19px; } .toolbar { flex-wrap:wrap; } #search { order:2; width:100%; margin-left:0; } .grid { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<section class="panel" role="dialog" aria-label="Catalogue des effets">
  <header>
    <div><h1>Catalogue des effets</h1><div class="hint">Les particules sont les effets animés. Les meshes Askel sont des pièces statiques de l’extraction, sans leur système d’effet d’origine. F6 ferme le menu.</div></div>
    <span class="push"></span><button class="close" id="close" title="Fermer">×</button>
  </header>
  <div class="toolbar">
    <button class="tab" data-type="all">Tout</button>
    <button class="tab active" data-type="particle">Particules animées</button>
    <button class="tab" data-type="mesh">Meshes bruts</button>
    <input id="search" type="search" placeholder="Rechercher un effet ou un pack…" autocomplete="off">
  </div>
  <main><div class="summary" id="summary">Chargement du catalogue…</div><div class="grid" id="grid"></div></main>
  <footer><button id="clear">Effacer mes effets</button><span id="notice"></span></footer>
</section>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let catalog = [], activeType = "particle", query = "";
  const pretty = (value) => String(value || "").replace(/^(SM_|P_)/, "").replace(/[_-]+/g, " ");
  function render() {
    const q = query.trim().toLocaleLowerCase();
    const items = catalog.filter(item => (activeType === "all" || item.type === activeType)
      && (!q || (item.name + " " + item.pack + " " + item.category).toLocaleLowerCase().includes(q)));
    $("summary").textContent = `${items.length} effet(s) affiché(s) sur ${catalog.length}`;
    const grid = $("grid"); grid.replaceChildren();
    if (!items.length) { const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = catalog.length ? "Aucun effet ne correspond à cette recherche." : "Aucun effet chargé. Vérifie que les asset packs sont ajoutés au serveur."; grid.appendChild(empty); return; }
    for (const item of items) {
      const button = document.createElement("button"); button.className = "item";
      const name = document.createElement("span"); name.className = "name"; name.textContent = pretty(item.name);
      const meta = document.createElement("span"); meta.className = "meta";
      const pack = document.createElement("span"); pack.textContent = item.pack;
      const badge = document.createElement("span"); badge.className = "badge"; badge.textContent = item.type === "particle" ? "ANIMÉ" : "MESH STATIQUE";
      meta.append(pack, badge); button.append(name, meta);
      button.addEventListener("click", () => {
        Events.Call("Spawn", item.id);
        notice(item.type === "particle" ? `Effet lancé : ${pretty(item.name)}` : `Mesh statique affiché : ${pretty(item.name)}`);
      });
      grid.appendChild(button);
    }
  }
  function notice(text) { $("notice").textContent = text; }
  document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
    activeType = tab.dataset.type; render();
  }));
  $("search").addEventListener("input", event => { query = event.target.value; render(); });
  $("close").addEventListener("click", () => Events.Call("Close"));
  $("clear").addEventListener("click", () => { Events.Call("Clear"); notice("Tes effets ont été effacés."); });
  document.addEventListener("keydown", event => { if (event.key === "Escape") Events.Call("Close"); });
  Events.Subscribe("Catalog", json => { try { catalog = JSON.parse(json); render(); } catch { notice("Catalogue invalide."); } });
  Events.Subscribe("Notice", json => { try { notice(JSON.parse(json)); } catch { notice(String(json)); } });
})();
</script>
</body>
</html>
