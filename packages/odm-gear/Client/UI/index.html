<html>
<head>
<style>
  body { margin: 0; background: transparent; font-family: sans-serif; }
  .panel { position: fixed; left: 40px; bottom: 40px; width: 260px; color: #fff; text-shadow: 0 0 4px #000; }
  .label { font-size: 14px; margin: 8px 0 4px; display: flex; justify-content: space-between; }
  .bar { height: 14px; background: rgba(0,0,0,.5); border: 2px solid #fff; border-radius: 3px; overflow: hidden; }
  #fill { height: 100%; width: 100%; background: #6cf; transition: width .1s; }
  #fill.low { background: #f55; }
  #blades { display: flex; gap: 4px; }
  #blades i { flex: 1; height: 14px; background: #ddd; border: 2px solid #fff; border-radius: 3px; transform: skewX(-20deg); }
  #blades i.off { background: rgba(0,0,0,.5); }
  #blades.reloading i { background: #fc4; animation: blink .4s infinite alternate; }
  @keyframes blink { to { opacity: .35; } }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 0; height: 0; }
  #crosshair i { position: absolute; background: #fff; box-shadow: 0 0 3px #000, 0 0 3px #000; }
  #crosshair .dot { width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; }
  #crosshair .l, #crosshair .r { width: 12px; height: 2px; margin-top: -1px; }
  #crosshair .l { left: -26px; }
  #crosshair .r { left: 14px; }
  #crosshair .t, #crosshair .b { width: 2px; height: 12px; margin-left: -1px; }
  #crosshair .t { top: -26px; }
  #crosshair .b { top: 14px; }
  #vignette, #blur { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #vignette { background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%); }
  #blur {
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    -webkit-mask-image: radial-gradient(ellipse at center, transparent 50%, #000 100%);
    mask-image: radial-gradient(ellipse at center, transparent 50%, #000 100%);
  }
  #wind { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
<script>
  Events.Subscribe("ODM:Status", function(gas, gasMax, blades, bladesMax, spare, reloading, spears) {
    var pct = Math.max(0, Math.min(100, gas / gasMax * 100));
    var fill = document.getElementById("fill");
    fill.style.width = pct + "%";
    fill.className = pct < 20 ? "low" : "";

    var box = document.getElementById("blades");
    box.className = reloading ? "reloading" : "";
    var html = "";
    for (var i = 0; i < bladesMax; i++) html += '<i class="' + (i < blades ? "" : "off") + '"></i>';
    box.innerHTML = html;
    document.getElementById("spare").textContent = "x" + spare;
    document.getElementById("spears").textContent = "x" + spears;
  });

  // ---- Effet de vitesse : lignes de vent qui partent du centre ----
  var speed = 0;
  var canvas, ctx, lines = [];
  Events.Subscribe("ODM:Speed", function(f) {
    speed = f;
    document.getElementById("vignette").style.opacity = Math.min(1, f * 1.1);
    document.getElementById("blur").style.opacity = Math.min(1, f * 1.2);
  });

  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  function spawnLine() {
    return { a: Math.random() * Math.PI * 2, r: 0.18 + Math.random() * 0.25, v: 0.6 + Math.random() * 1.2, len: 0.05 + Math.random() * 0.12 };
  }
  function frame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (speed > 0.05) {
      var cx = canvas.width / 2, cy = canvas.height / 2, R = Math.max(cx, cy) * 1.4;
      var want = Math.floor(speed * 60);
      while (lines.length < want) lines.push(spawnLine());
      while (lines.length > want) lines.pop();
      ctx.lineWidth = 1.5;
      for (var i = 0; i < lines.length; i++) {
        var l = lines[i];
        l.r += l.v * (0.012 + speed * 0.03);
        if (l.r > 1) { lines[i] = spawnLine(); continue; }
        var r0 = l.r * R, r1 = (l.r + l.len * (0.5 + speed)) * R;
        ctx.strokeStyle = "rgba(255,255,255," + (0.5 * speed * Math.min(1, l.r * 2)) + ")";
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(l.a) * r0, cy + Math.sin(l.a) * r0);
        ctx.lineTo(cx + Math.cos(l.a) * r1, cy + Math.sin(l.a) * r1);
        ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener("load", function() {
    canvas = document.getElementById("wind");
    ctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
    frame();
  });
</script>
</head>
<body>
  <canvas id="wind"></canvas>
  <div id="blur"></div>
  <div id="vignette"></div>
  <div id="crosshair"><i class="dot"></i><i class="l"></i><i class="r"></i><i class="t"></i><i class="b"></i></div>
  <div class="panel">
    <div class="label"><span>GAZ</span></div>
    <div class="bar"><div id="fill"></div></div>
    <div class="label"><span>LAMES</span><span id="spare">x3</span></div>
    <div id="blades"></div>
    <div class="label"><span>LANCES-FOUDRE</span><span id="spears">x3</span></div>
  </div>
</body>
</html>
