# Partie propre « Kimetsu RP » : le mode de jeu kimetsu-pandora, aucun addon, et seulement les packs d'assets faits pour le projet.
# Copie ce fichier sous le nom Config.toml dans le dossier du serveur nanos world, puis adapte le nom, le port et le nombre de joueurs.
# Les packs d'assets ne sont pas dans le dépôt : voir docs/ASSETS.md pour les cuire avec Unreal et les déposer dans Assets/.

[discover]
    name =                   "Kimetsu RP"
    description =            ""
    language =               "global"
    ip =                     "0.0.0.0"
    port =                   7777
    query_port =             7778
    announce =               false
    dedicated_server =       true

[general]
    max_players =            16
    password =               ""
    token =                  ""
    banned_ids = [
    ]

[game]
    map =                    "default-blank-map"
    game_mode =              "kimetsu-pandora"
    # Addons à charger en plus du mode de jeu : aucun pour la partie propre. Ceux du dépôt (packages/) :
    # nanos-admin, gmod-props-menu, fx-showcase-menu.
    packages = [
    ]
    # Packs d'assets (le mode de jeu les exige déjà dans son Package.toml : cette liste sert à les afficher dans la fenêtre de lancement).
    assets = [
                            "pandora-demonslayer",
                            "aksel-animations",
                            "scythe",
                            "yufu-arme-test",
                            "vefects",
                            "free-magic",
                            "free-spells",
                            "sword-trail-vfx",
                            "breath-fx",
    ]
    # "kimetsu-pandora-loading" active l'écran de chargement (il faut d'abord déposer une vidéo bg.webm dans packages/kimetsu-pandora-loading).
    loading_screen =         ""

[custom_settings]
    enable_auto_weather = true
    enable_default_sky = true
    enable_noclip = true
    enable_pvp = true

[debug]
    log_level =              1
    async_log =              true
    profiling =              false

[optimization]
    max_tick_rate =          30
    max_sync_rate =          30
    max_send_rate =          1024
    max_file_transfer_rate = 1024
    distance_optimization =  4
